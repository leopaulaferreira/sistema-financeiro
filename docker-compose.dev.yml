# PostgreSQL exclusivo para desenvolvimento local deste projeto — descartável,
# não relacionado a nenhum outro container/projeto na máquina (ver
# ARCHITECTURE.md §13). NÃO é usado em produção: a decisão de produção
# depende do checklist de inspeção da VM, ainda não realizado.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema-financeiro-db-dev
    environment:
      POSTGRES_DB: sistema_financeiro
      POSTGRES_USER: sistema_financeiro_app
      POSTGRES_PASSWORD: dev-only-password-not-used-in-production
    ports:
      - "5432:5432"
    volumes:
      - sistema-financeiro-db-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistema_financeiro_app -d sistema_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sistema-financeiro-db-dev-data:
