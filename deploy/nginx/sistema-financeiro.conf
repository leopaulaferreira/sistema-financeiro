# Nginx — único ponto público desta aplicação (backend e Postgres nunca
# expostos diretamente). Ver DEPLOYMENT.md para o procedimento completo de
# instalação/certbot. Ajuste SEU-DOMINIO-AQUI e as duas raízes de arquivo
# antes de usar.
#
# Divisão de responsabilidade de security headers (ver ARCHITECTURE.md,
# Fase 10): a API (Spring Security) já manda CSP restritiva própria
# (default-src 'none') para as respostas JSON dela — os headers abaixo
# valem só para o HTML/assets estáticos do frontend, servidos por este
# bloco. Não duplicar/contradizer: o bloco /api abaixo NÃO reescreve esses
# headers, deixa a resposta do backend passar como veio.

# --- redirect HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name SEU-DOMINIO-AQUI;

    # Necessário para o desafio HTTP-01 do Certbot renovar o certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 on; — diretiva só existe em Nginx >= 1.25.1; em versões mais
    # antigas (ex.: a instalada via apt no Ubuntu 24.04 usada em produção
    # desta aplicação) ela quebra "nginx -t" com "unknown directive".
    # Confira "nginx -V" antes de descomentar; sem ela o HTTP/2 simplesmente
    # não é anunciado, HTTPS continua funcionando normalmente em HTTP/1.1.
    server_name SEU-DOMINIO-AQUI;

    # Gerados pelo Certbot (certbot --nginx) — não versionar os arquivos
    # reais, só este caminho. Ver DEPLOYMENT.md, seção HTTPS.
    ssl_certificate     /etc/letsencrypt/live/SEU-DOMINIO-AQUI/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU-DOMINIO-AQUI/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Frontend estático (build do Vite) — ajustar para o path real do
    # deploy atômico (ver DEPLOYMENT.md, "current" é um symlink trocado
    # após cada release, nunca o diretório editado in-place).
    root /var/www/sistema-financeiro/current;
    index index.html;

    # Security headers (HSTS/CSP/etc.) são repetidos em CADA location abaixo
    # que serve o frontend, em vez de declarados uma vez aqui no server{}.
    # Motivo (pegadinha real do Nginx, validada em produção): "add_header"
    # só é herdado de um bloco pai se o bloco filho não declarar nenhum
    # "add_header" próprio — como /assets/ e /index.html já têm o seu
    # (Cache-Control), declará-los só aqui faria elas PERDEREM todos os
    # headers de segurança silenciosamente. Como bônus, isso também mantém
    # /api/ (que não declara nenhum add_header) livre desses headers de
    # propósito — a API já manda sua própria CSP restritiva para JSON (ver
    # ARCHITECTURE.md, Fase 10); duplicar/contradizer aqui seria pior que
    # não ter.
    #
    # HSTS: só habilitar depois de validar que HTTPS funciona de ponta a
    # ponta (ver DEPLOYMENT.md) — um HSTS quebrado trava o domínio até o
    # max-age expirar no navegador do usuário. Conservador: sem preload,
    # sem includeSubDomains (não sabemos se outros subdomínios da VM
    # também têm HTTPS válido). style-src precisa de 'unsafe-inline' porque
    # Radix UI (usado pelo shadcn/ui) define estilos inline via JS para
    # posicionamento de popover/dropdown/tooltip — sem isso a UI quebra
    # silenciosamente. Nenhum unsafe-eval nem unsafe-inline em script-src.

    # Assets com hash no nome (Vite): cache longo e imutável.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    # index.html nunca pode ficar em cache — é o ponto de entrada da SPA e
    # referencia os hashes de build atuais; cachear isso quebraria updates.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Proxy /api para o backend Spring Boot local — nunca exposto direto.
    # Sem add_header aqui de propósito (ver nota acima) — a resposta do
    # backend passa como veio.
    location /api/ {
        proxy_pass http://127.0.0.1:8084/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Cookies HttpOnly do backend (access_token/refresh_token/XSRF-TOKEN)
        # passam sem modificação — same-origin via este proxy, então não há
        # necessidade de reescrever Domain/Path.
    }

    # SPA fallback — só para navegação de página (rotas do React Router),
    # nunca aplicado sobre /api (bloco acima tem precedência por ser mais
    # específico).
    location / {
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
