spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Fase 10: só /actuator/health é exposto via HTTP, e sem detalhes (evita
# vazar config/dependências internas em produção); nenhum outro endpoint do
# Actuator (env, beans, configprops, mappings, heapdump) é habilitado.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  cookie:
    secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  recurring-processing:
    # Fase 6: expressão cron de 6 campos (Spring), default de hora em hora —
    # não precisa ser mais frequente, ver ARCHITECTURE.md.
    cron: ${RECURRING_PROCESSING_CRON:0 0 * * * *}

logging:
  level:
    org.springframework.security: WARN
