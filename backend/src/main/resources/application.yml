spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  cookie:
    secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  recurring-processing:
    # Fase 6: expressão cron de 6 campos (Spring), default de hora em hora —
    # não precisa ser mais frequente, ver ARCHITECTURE.md.
    cron: ${RECURRING_PROCESSING_CRON:0 0 * * * *}

logging:
  level:
    org.springframework.security: WARN
