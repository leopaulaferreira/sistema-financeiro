name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# SEC-013: least privilege do GITHUB_TOKEN — este workflow só roda testes/build,
# nunca precisa de escrita em conteúdo/PRs/issues.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (test + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # SEC-014: actions oficiais fixadas por SHA (não por tag mutável @v4) —
      # hardening de supply chain. SHA de cada tag comentado ao lado.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Testcontainers precisa de Docker para subir o PostgreSQL real usado
      # pelos testes de integração (ARCHITECTURE.md) — o runner ubuntu-latest
      # já vem com o daemon disponível, nada extra a configurar aqui.
      - name: Run tests (Testcontainers/PostgreSQL real)
        run: ./mvnw --batch-mode test

      - name: Package
        run: ./mvnw --batch-mode package -DskipTests

  frontend:
    name: Frontend (lint + test + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Audit dependencies
        # não falha o job: audit é um sinal a revisar, não um gate automático
        # (o projeto ainda não tem uma política formal de severidade/CVE aceitável).
        run: npm audit || true
