name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (test + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Testcontainers precisa de Docker para subir o PostgreSQL real usado
      # pelos testes de integração (ARCHITECTURE.md) — o runner ubuntu-latest
      # já vem com o daemon disponível, nada extra a configurar aqui.
      - name: Run tests (Testcontainers/PostgreSQL real)
        run: ./mvnw --batch-mode test

      - name: Package
        run: ./mvnw --batch-mode package -DskipTests

  frontend:
    name: Frontend (lint + test + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Audit dependencies
        # não falha o job: audit é um sinal a revisar, não um gate automático
        # (o projeto ainda não tem uma política formal de severidade/CVE aceitável).
        run: npm audit || true
